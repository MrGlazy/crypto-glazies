# Glazies Crypto AI — runs the predictor on a NAS and uploads results to the website.
# Start:  docker compose up -d          Stop:  docker compose stop   (or: docker stop glazies-ai)
# Pause without stopping: AI Predictor card on the website → Pause (site owner only).
# On every start it downloads the latest code from GitHub, so updates arrive automatically.
services:
  glazies-ai:
    image: node:20-alpine
    container_name: glazies-ai
    restart: unless-stopped
    environment:
      SITE_URL: https://crypto.glazzy.site
      UPLOAD_TOKEN: paste-your-token-here
      EVERY_MIN: "5"
      BACKTEST_MIN: "60"
      TZ: Europe/Paris
    command: >
      sh -c "apk add --no-cache git >/dev/null &&
             rm -rf /app && git clone --depth 1 https://github.com/MrGlazy/crypto-glazies.git /app &&
             exec nice -n 19 node /app/nas/runner.mjs"
    # Keep the NAS responsive: at most 1 CPU core and 768 MB RAM, lowest priority
    cpus: 1.0
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
