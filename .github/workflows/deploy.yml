name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip (FTP secrets not set — using Hostinger Git auto-deploy instead)
        if: env.FTP_SERVER == ''
        run: echo "No FTP_SERVER secret; skipping FTP upload."

      - name: Upload site via FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Folder of the crypto.glazzy.site subdomain, relative to the FTP login root.
          # Hostinger usually uses: public_html/crypto/  (check hPanel → Files → File Manager)
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/crypto/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            *.zip
